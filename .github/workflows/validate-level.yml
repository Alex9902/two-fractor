name: Validate Level PR

on:
  pull_request:
    paths:
      - "src/levels/**"

jobs:
  validate:
    name: Validate Level Structure & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -p ts.config.json --noEmit

      - name: Run level tests & manifest validation
        run: npm test

      - name: Production build
        run: npm run build
